name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig name'
        required: true
        default: 'local_defconfig'

env:
  ARCH: arm64
  SUBARCH: arm64

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: fructosecloud/kernel_xiaomi_msm8998_mod
          ref: thirteen-plus
          path: kernel
          fetch-depth: 1

      - name: Selective merge CAF tag v4.4.302
        working-directory: kernel
        run: |
          # 设置 Git 用户
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # 1. 备份当前的设备树目录（如果存在）
          if [ -d arch/arm64/boot/dts ]; then
            cp -r arch/arm64/boot/dts /tmp/my_dts_backup
          fi

          # 2. 添加 CAF 远程并获取标签
          git remote add caf https://git.codelinaro.org/clo/la/kernel/msm-4.4.git
          git fetch caf tag v4.4.302 --depth=1

          # 3. 开始合并（自动接受所有 CAF 的修改，除了设备树我们稍后会覆盖）
          #    使用 -X theirs 可以优先采用 CAF 的代码，但设备树我们后面会覆盖，所以无妨。
          git merge -X theirs --allow-unrelated-histories --no-commit FETCH_HEAD || true

          # 4. 立即恢复你自己的设备树（删除合并来的设备树，复制备份回去）
          rm -rf arch/arm64/boot/dts
          if [ -d /tmp/my_dts_backup ]; then
            cp -r /tmp/my_dts_backup arch/arm64/boot/dts
          fi

          # 5. 清理因 file/directory 冲突产生的临时文件（如果有）
          find . -name "*~HEAD" -type f -delete

          # 6. 将所有修改加入暂存区并提交
          git add .
          git commit -m "Merge CAF tag v4.4.302 (keep our device tree, auto-resolve others)" || echo "No changes to commit"

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc bison build-essential ccache curl \
            flex g++-multilib git gperf \
            liblz4-tool libncurses5-dev libssl-dev \
            libxml2-utils lzop rsync schedtool \
            zip zlib1g-dev \

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: '2G'

      - name: Download Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git

      - name: Patch vdso32 Makefile to remove -no-integrated-as and --prefix
        working-directory: kernel
        run: |
          # 删除 -no-integrated-as 和 $(CLANG_PREFIX32)
          sed -i 's/ -no-integrated-as//' arch/arm64/kernel/vdso32/Makefile
          sed -i 's/ $(CLANG_PREFIX32)//' arch/arm64/kernel/vdso32/Makefile
          # 验证修改结果
          echo "Modified line:"
          grep -n "CC_ARM32 :=" arch/arm64/kernel/vdso32/Makefile || true

      - name: Build Kernel
        working-directory: kernel
        run: |
          export PATH="/usr/lib/ccache:$GITHUB_WORKSPACE/proton-clang/bin:$PATH"
          mkdir -p out
          make O=out clean
          make O=out mrproper
          make O=out ${{ github.event.inputs.defconfig }}

          # 开启 32-bit compat vDSO
          scripts/config --file out/.config --enable CONFIG_COMPAT_VDSO
          make O=out olddefconfig

          # 编译
          make O=out -j1 V=1 \
              CC=clang \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              2>&1 | tee build.log

      - name: Package kernel image
        run: |
          mkdir artifacts
          if [ -f kernel/out/arch/arm64/boot/Image.gz ]; then
            cp kernel/out/arch/arm64/boot/Image.gz artifacts/
          elif [ -f kernel/out/arch/arm64/boot/Image ]; then
            cp kernel/out/arch/arm64/boot/Image artifacts/
          else
            echo "No kernel image found!"; exit 1
          fi
          tar -czf kernel_image.tar.gz -C artifacts .

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: kernel_image.tar.gz

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          path: kernel/build.log
          name: build-log
        if: always()
